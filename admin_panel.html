<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <link rel="icon" type="image/png" href="./static/img/logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الموقع - أجرلي Ajarli</title>
    
    <!-- Bootstrap RTL -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <!-- Google Fonts: Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="./static/css/style.css">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg fixed-top bg-dark border-bottom border-danger" data-bs-theme="dark">
        <div class="container">
            <a class="navbar-brand text-white" href="home.html">
                <i class="fa-solid fa-shield-halved text-danger me-1 ms-1"></i>
                أجرلي <span class="fw-bold text-danger">ADMIN</span>
            </a>
            <div class="d-flex gx-2">
                <a href="home.html" class="btn btn-outline-light ms-2 rounded-pill px-4"><i class="fa-solid fa-house ms-1"></i> العودة للموقع</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main style="padding-top: 100px; min-height: 80vh;" class="bg-light">
        <div class="container reveal mt-4 pb-5">
            <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-4 border-danger">
                <div>
                    <h2 class="fw-bold fs-3 text-dark mb-1">
                        <i class="fa-solid fa-user-shield text-danger ms-2"></i> لوحة تحكم المسئول
                    </h2>
                    <p class="text-muted mb-0">يمكنك هنا مراجعة كافة عقارات المستخدمين وحذف المخالف منها.</p>
                </div>
            </div>

            <!-- Nav tabs -->
            <ul class="nav nav-tabs mb-4 border-danger" id="adminTabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active fw-bold text-dark" id="properties-tab" data-bs-toggle="tab" data-bs-target="#properties" type="button" role="tab" aria-controls="properties" aria-selected="true"><i class="fa-solid fa-house-user text-primary ms-1"></i> العقارات</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link fw-bold text-dark" id="reports-tab" data-bs-toggle="tab" data-bs-target="#reports" type="button" role="tab" aria-controls="reports" aria-selected="false"><i class="fa-solid fa-flag text-danger ms-1"></i> البلاغات <span class="badge bg-danger rounded-pill" id="reports-count">0</span></button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link fw-bold text-dark" id="support-tab" data-bs-toggle="tab" data-bs-target="#support" type="button" role="tab" aria-controls="support" aria-selected="false"><i class="fa-solid fa-headset text-success ms-1"></i> رسائل الدعم <span class="badge bg-success rounded-pill" id="support-count">0</span></button>
                </li>
            </ul>

            <!-- Tab panes -->
            <div class="tab-content" id="adminTabsContent">
                <!-- Properties Tab -->
                <div class="tab-pane fade show active" id="properties" role="tabpanel" aria-labelledby="properties-tab">
                    <div class="row mb-4 g-3">
                        <div class="col-md-4">
                            <div class="p-3 bg-white border-start border-4 border-danger rounded shadow-sm">
                                <h6 class="text-muted fw-bold">إجمالي العقارات النشطة</h6>
                                <h3 class="fw-bold mb-0 text-danger" id="total-properties-count"><i class="fa-solid fa-spinner fa-spin fs-4 text-muted"></i></h3>
                            </div>
                        </div>
                    </div>
                    <div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4" id="admin-properties-container">
                        <div class="col-12 text-center py-5 w-100">
                            <div class="spinner-border text-danger"></div>
                            <p class="text-muted mt-2">جاري تحميل بيانات العقارات...</p>
                        </div>
                    </div>
                </div>

                <!-- Reports Tab -->
                <div class="tab-pane fade" id="reports" role="tabpanel" aria-labelledby="reports-tab">
                    <div class="row row-cols-1 g-3" id="admin-reports-container">
                        <div class="col-12 text-center py-5">
                            <div class="spinner-border text-danger"></div>
                            <p class="text-muted mt-2">جاري تحميل البلاغات...</p>
                        </div>
                    </div>
                </div>

                <!-- Support Tab -->
                <div class="tab-pane fade" id="support" role="tabpanel" aria-labelledby="support-tab">
                    <div class="row row-cols-1 g-3" id="admin-support-container">
                        <div class="col-12 text-center py-5">
                            <div class="spinner-border text-success"></div>
                            <p class="text-muted mt-2">جاري تحميل رسائل الدعم...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center bg-dark text-white shadow-lg mt-auto">
        <div class="container py-4">
            <p class="mb-0 text-muted">© 2026 أجرلي Ajarli - Admin Dashboard</p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./static/js/main.js"></script>
    <script type="module" src="./static/js/firebase-app.js"></script>

    <!-- Mobile Bottom Nav -->
    <div class="mobile-bottom-nav d-lg-none">
        <a href="home.html" class="nav-item">
            <i class="fa-solid fa-house"></i>
        </a>
        <a href="#" class="nav-item">
            <i class="fa-solid fa-magnifying-glass"></i>
        </a>
        <a href="add_property.html" class="nav-item center-add-btn">
            <div class="add-btn-inner">
                <i class="fa-solid fa-building"></i>
            </div>
        </a>
        <a href="#" class="nav-item chat-toggle-btn" data-action="toggle-chat">
            <i class="fa-solid fa-comment-dots"></i>
        </a>
        <a href="account.html" class="nav-item">
            <i class="fa-regular fa-user"></i>
        </a>
    </div>

</body>
</html>
