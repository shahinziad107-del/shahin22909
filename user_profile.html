<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <link rel="icon" type="image/png" href="./static/img/logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الملف الشخصي - أجرلي Ajarli</title>
    
    <!-- Bootstrap RTL -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <!-- Google Fonts: Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="./static/css/style.css?v=1.1">
</head>
<body style="background-color: var(--bg-color, #f8f9fa);">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg smart-scroll py-2 sticky-top bg-white shadow-sm">
        <div class="container d-flex justify-content-between align-items-center">
            
            <a class="navbar-brand d-flex align-items-center m-0" href="home.html">
                <img src="./static/img/logo.png" alt="Logo" height="40" class="ms-2 shadow-sm" style="border-radius: 10px;">
                <span class="fs-4 fw-bold text-primary">أجرلي</span>
            </a>
            
            <div class="collapse navbar-collapse justify-content-center d-none d-lg-flex" id="navbarNav">
                <ul class="navbar-nav">
                    
                    
                </ul>
            </div>
            
            <div class="d-flex align-items-center gap-3">

                <div class="dropdown chat-hover-wrapper me-2 d-none d-lg-flex" id="nav-chat-container">
                    <button class="liquid-search-btn chat-toggle-btn" id="nav-chat-btn" data-action="toggle-chat" title="الرسائل" style="background: rgba(16, 185, 129, 0.15); color: var(--accent-color); border: 1px solid rgba(16, 185, 129, 0.4);">
                        <i class="fa-solid fa-comment-dots"></i>
                        <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none" id="chat-unread-count" style="font-size: 0.7rem; padding: 0.35em 0.5em;">0</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end chat-hover-dropdown shadow-lg border-0" id="chat-hover-dropdown" style="border-radius: 16px; min-width: 280px; top: 120%; backdrop-filter: blur(10px); background: var(--glass-bg);">
                        <li><span class="dropdown-item text-muted text-center py-3"><i class="fa-solid fa-spinner fa-spin"></i> جاري التحميل...</span></li>
                    </ul>
                </div>
                <div class="glass-theme-toggle" dir="ltr">
                    <div class="toggle-slider"></div>
                    <button class="theme-btn" data-theme-val="light" title="وضع النهار">
                        <i class="fa-regular fa-sun"></i>
                    </button>
                    <button class="theme-btn" data-theme-val="dark" title="وضع الليل">
                        <i class="fa-regular fa-moon"></i>
                    </button>
                    <button class="theme-btn" data-theme-val="auto" title="تلقائي">
                        <i class="fa-solid fa-cloud-sun"></i>
                    </button>
                </div>
                
                <div class="d-none d-lg-flex gx-2 align-items-center" id="nav-auth-buttons">
                    <a href="account.html" class="btn btn-outline-primary ms-2 rounded-pill px-4"><i class="fa-regular fa-user ms-1"></i> حسابي</a>
                    <a href="add_property.html" class="btn btn-primary rounded-pill px-4 shadow-sm">إضافة عقار</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container py-5 mt-4" style="min-height: 80vh;">
        
        <!-- User Profile Banner -->
        <div class="bg-white rounded-4 p-4 shadow-sm border border-light-subtle mb-5 position-relative overflow-hidden">
            <!-- Decorative background element -->
            <div class="position-absolute top-0 end-0 w-100 h-100" style="background: linear-gradient(135deg, rgba(59, 130, 246, 0.05) 0%, rgba(16, 185, 129, 0.05) 100%); z-index: 0;"></div>
            
            <div class="row align-items-center position-relative" style="z-index: 1;">
                <div class="col-md-8">
                    <div id="user-profile-header">
                        <div class="d-flex align-items-center flex-column">
                            <div class="spinner-border text-primary my-4" role="status">
                                <span class="visually-hidden">جاري التحميل...</span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-4 text-md-start mt-4 mt-md-0 d-flex flex-column align-items-md-start align-items-center border-md-end pe-md-4">
                    <button id="profile-chat-btn" class="btn btn-primary btn-lg rounded-pill shadow-lg fw-bold px-4 py-3 w-100" style="transition: all 0.3s ease; max-width: 300px;">
                        <i class="fa-solid fa-comment-dots ms-2 fs-5"></i> تواصل معي
                    </button>
                    <div class="mt-4 text-muted fw-bold d-flex justify-content-between align-items-center w-100" style="max-width: 300px; background: rgba(0,0,0,0.02); padding: 10px 20px; border-radius: 15px;">
                        <span>إجمالي العقارات</span>
                        <span class="badge bg-secondary rounded-pill fs-6" id="user-total-properties">0</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- User Properties Full Width -->
        <div>
            <div class="d-flex justify-content-between align-items-end border-bottom pb-3 mb-4">
                <h3 class="fw-bold text-primary m-0"><i class="fa-solid fa-building ms-2"></i> عقارات المستخدم</h3>
            </div>
            
            <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4" id="user-properties-container">
                <div class="col-12 text-center text-muted mt-5">
                    <i class="fa-solid fa-spinner fa-spin fs-1 mb-3"></i>
                    <br>جاري تحميل العقارات...
                </div>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center" style="padding: 15px 0; font-size: 0.85rem;">
        <div class="container">
            <p class="mb-0 footer-glass-glow fw-bold">© 2026 أجرلي Ajarli. جميع الحقوق محفوظة.</p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="./static/js/main.js?v=1.1"></script>
    <script type="module" src="./static/js/firebase-app.js?v=1.1"></script>

    <!-- Mobile Bottom Nav -->
    <div class="mobile-bottom-nav d-lg-none">
        <a href="home.html" class="nav-item">
            <i class="fa-solid fa-house"></i>
        </a>
        <a href="#" class="nav-item" data-bs-toggle="modal" data-bs-target="#searchModal">
            <i class="fa-solid fa-magnifying-glass"></i>
        </a>
        <a href="add_property.html" class="nav-item center-add-btn">
            <div class="add-btn-inner">
                <i class="fa-solid fa-building"></i>
            </div>
        </a>
        <a href="#" class="nav-item chat-toggle-btn" data-action="toggle-chat">
            <i class="fa-solid fa-comment-dots"></i>
        </a>
        <a href="account.html" class="nav-item">
            <i class="fa-regular fa-user"></i>
        </a>
    </div>


    <!-- Floating Desktop Search Button -->
    <button class="liquid-search-btn floating-search-btn d-none d-lg-flex" data-bs-toggle="modal" data-bs-target="#searchModal" title="بحث" id="desktop-floating-search">
        <i class="fa-solid fa-magnifying-glass"></i>
    </button>
</body>
</html>
