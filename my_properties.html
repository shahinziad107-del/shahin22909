<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <link rel="icon" type="image/png" href="./static/img/logo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عقاراتي - أجرلي Ajarli</title>
    
    <!-- Bootstrap RTL -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <!-- Google Fonts: Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="./static/css/style.css">
    <link rel="stylesheet" href="./chat_styles.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container">
            <a class="navbar-brand" href="home.html">
                <img src="./static/img/logo.png" alt="Logo" height="30" class="ms-1" style="border-radius: 8px;">
                أجرلي <span class="fw-normal fs-6 text-muted me-1">Ajarli</span>
            </a>
<!-- Mobile Nav Toggler Removed -->
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    
                    <li class="nav-item">
                        <a class="nav-link" href="#"><i class="fa-solid fa-magnifying-glass ms-1"></i>بحث</a>
                    </li>
                    
                </ul>
                <div class="d-flex gx-2">
                    <a href="account.html" class="btn btn-outline-primary ms-2 rounded-pill px-4 active"><i class="fa-regular fa-user ms-1"></i> حسابي</a>
                    <a href="add_property.html" class="btn btn-primary rounded-pill px-4 shadow-sm">إضافة عقار</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container py-5 mt-4" style="min-height: 80vh;">
        <!-- Modern Page Header Banner -->
        <div class="bg-white rounded-4 p-4 shadow-sm border border-light-subtle mb-5 position-relative overflow-hidden">
            <!-- Decorative background element -->
            <div class="position-absolute top-0 end-0 w-100 h-100" style="background: linear-gradient(135deg, rgba(59, 130, 246, 0.08) 0%, rgba(16, 185, 129, 0.08) 100%); z-index: 0;"></div>
            
            <div class="row align-items-center position-relative" style="z-index: 1;">
                <div class="col-md-8">
                    <div class="d-flex align-items-center gap-3">
                        <div class="bg-primary text-white rounded-circle d-flex justify-content-center align-items-center shadow-sm" style="width: 70px; height: 70px; font-size: 2rem;">
                            <i class="fa-solid fa-house-chimney"></i>
                        </div>
                        <div>
                            <h2 class="fw-bold fs-3 text-dark mb-1">عقاراتي المعروضة</h2>
                            <p class="text-muted mb-0">لوحة تحكم لإدارة وعرض عقاراتك ومتابعة حالتها</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-4 text-md-end mt-4 mt-md-0 d-flex flex-column align-items-md-end align-items-center border-md-start ps-md-4">
                    <a href="add_property.html" class="btn btn-primary btn-lg rounded-pill shadow-lg fw-bold px-4 py-3 w-100 hover-lift" style="transition: all 0.3s ease; max-width: 300px;">
                        <i class="fa-solid fa-plus ms-2 fs-5"></i> إضافة عقار جديد
                    </a>
                </div>
            </div>
        </div>

        <div class="container px-0 reveal">
            <div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4" id="properties-container">
                <!-- Dummy Property -->
                <div class="col text-center mt-5 mb-5 w-100">
                    <i class="fa-solid fa-spinner fa-spin fs-1 text-primary"></i>
                    <p class="mt-2 text-muted fw-bold">جاري تحميل العقارات...</p>
                </div>
            </div>
        </div>
    </main>

        <!-- Footer -->
    <footer class="text-center" style="padding: 15px 0; font-size: 0.85rem;">
        <div class="container">
            <p class="mb-0 footer-glass-glow fw-bold">© 2026 أجرلي Ajarli. جميع الحقوق محفوظة.</p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="./static/js/main.js"></script>
    <script src="./chat_logic.js"></script>
    <script type="module" src="./static/js/firebase-app.js"></script>

            <!-- Mobile Bottom Nav Wrapper (Iconly Style) -->
    <div class="mobile-nav-wrapper d-lg-none">
        <div class="mobile-bottom-nav">
            <a href="home.html" class="nav-item">
                <i class="fa-solid fa-house"></i>
                <span>الرئيسية</span>
            </a>
            <a href="my_properties.html" class="nav-item">
                <i class="fa-regular fa-compass"></i>
                <span>استكشف</span>
            </a>
            <a href="#" class="nav-item chat-toggle-btn" data-action="toggle-chat">
                <i class="fa-regular fa-comment-dots"></i>
                <span>الرسائل</span>
            </a>
            <a href="account.html" class="nav-item">
                <i class="fa-solid fa-gear"></i>
                <span>الإعدادات</span>
            </a>
        </div>
        <button class="mobile-nav-search-btn" data-bs-toggle="modal" data-bs-target="#searchModal" title="بحث">
            <i class="fa-solid fa-magnifying-glass"></i>
        </button>
    </div>
<!-- Floating Desktop Search Button -->
    <button class="liquid-search-btn floating-search-btn d-none d-lg-flex" data-bs-toggle="modal" data-bs-target="#searchModal" title="بحث" id="desktop-floating-search">
        <i class="fa-solid fa-magnifying-glass"></i>
    </button>
</body>
</html>
